# Render Blueprint — provisions the IntellaBets API + Postgres + Redis.
# Deploy: push to GitHub, then Render Dashboard -> New -> Blueprint -> pick this repo.
# Set the two `sync: false` secrets (ANTHROPIC_API_KEY, THE_ODDS_API_KEY) in the
# Render dashboard after the first deploy.

databases:
  - name: intellabets-db
    databaseName: intellabets
    plan: free

services:
  - type: redis
    name: intellabets-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: intellabets-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intellabets-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: intellabets-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAILS
        value: free9dmc@icloud.com
      # Sports the engine ingests odds for. Each one costs API requests on
      # every poll cycle, so this list is the main lever on Odds API quota.
      #
      # MLB alone was leaving the picks pages empty: the regular season ends
      # in late September, so for most of the year there are no games, no
      # odds, and therefore nothing for the engine to find an edge in. NFL and
      # college football run Sep-Jan, NBA and NHL Oct-Jun, so together these
      # cover the calendar with no dead months.
      #
      # Quota is in Odds API credits: each /odds call costs markets (3) x
      # regions, and nothing when the sport has no games; /scores with
      # daysFrom costs 2. Sized for the 20K plan: one region every 45 min is
      # 3 x 32 = 96 credits a day per in-season sport (about 11,500 a month
      # for four), plus 5 x 8 x 2 = 80 a day for /scores every 3 hours
      # (about 2,400): roughly 14,000 a month. Two regions every 30 min is
      # about 42,000, which needs the 100K plan. Keep POLL_INTERVAL_MIN under
      # 90: the board and AI Picks refuse prices older than that.
      - key: ACTIVE_SPORTS
        value: americanfootball_nfl,americanfootball_ncaaf,basketball_nba,icehockey_nhl,baseball_mlb
      # us = DraftKings, FanDuel, BetMGM, BetRivers (+ Caesars, Fanatics when listed);
      # us2 adds Hard Rock, theScore Bet, Bally Bet and betPARX but doubles
      # credits per call, so it is off on the 20K plan.
      - key: ODDS_REGIONS
        value: us
      - key: POLL_INTERVAL_MIN
        value: "45"
      - key: SETTLE_INTERVAL_MIN
        value: "180"
      # Player props (AI Picks "Player props"). A separate job per sport, every
      # PROPS_INTERVAL_MIN, fetches each event at most twice: once in the early
      # window and once in the late window before it starts (minutes, lo-hi).
      # Each event call costs (prop markets returned x PROPS_REGIONS) credits:
      # up to 4 for NBA, 5 for NFL and 2 for NHL; the /events listing is free.
      # Two calls an event comes to about 3,300-3,450 credits a month, which
      # with game lines is about 17,400 of the 20K plan. The PropsFetch table
      # in the engine database counts the spend: early-window calls stop at 80%
      # of PROPS_CREDIT_CAP_MONTH, late ones at the cap (UTC calendar month),
      # and every props call stops while fewer than PROPS_MIN_REMAINING_CREDITS
      # would be left, so game lines keep their credits. Set PROPS_SPORTS to ""
      # and restart to pause props. Each sport must also be in ACTIVE_SPORTS.
      # (ODDS_API_BASE_URL, for the local fake API, is ignored in production.)
      - key: PROPS_SPORTS
        value: basketball_nba,americanfootball_nfl,icehockey_nhl
      - key: PROPS_INTERVAL_MIN
        value: "30"
      - key: PROPS_EARLY_WINDOW_MIN
        value: "240-360"
      - key: PROPS_LATE_WINDOW_MIN
        value: "45-105"
      # Props keep their own regions, so adding us2 to ODDS_REGIONS for game
      # lines does not double what props cost. All the routable prop books
      # (FanDuel, DraftKings, BetMGM, Caesars, BetRivers) are in us.
      - key: PROPS_REGIONS
        value: us
      - key: PROPS_CREDIT_CAP_MONTH
        value: "3500"
      - key: PROPS_MIN_REMAINING_CREDITS
        value: "1000"
      # The props board refuses prices older than this. An early fetch at 360
      # minutes and a late one just above 45 are 315 minutes apart.
      - key: PROPS_MAX_PRICE_AGE_MIN
        value: "330"
      # Props snapshots (a few hundred KB each) are deleted once their game
      # started more than this many days ago; game-line snapshots are kept.
      - key: PROPS_SNAPSHOT_RETENTION_DAYS
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: THE_ODDS_API_KEY
        sync: false

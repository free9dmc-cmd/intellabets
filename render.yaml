# Render Blueprint — provisions the IntellaBets API + Postgres + Redis.
# Deploy: push to GitHub, then Render Dashboard -> New -> Blueprint -> pick this repo.
# Set the two `sync: false` secrets (ANTHROPIC_API_KEY, THE_ODDS_API_KEY) in the
# Render dashboard after the first deploy.

databases:
  - name: intellabets-db
    databaseName: intellabets
    plan: free

services:
  - type: redis
    name: intellabets-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: intellabets-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intellabets-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: intellabets-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAILS
        value: free9dmc@icloud.com
      # Sports the engine ingests odds for. Each one costs API requests on
      # every poll cycle, so this list is the main lever on Odds API quota.
      #
      # MLB alone was leaving the picks pages empty: the regular season ends
      # in late September, so for most of the year there are no games, no
      # odds, and therefore nothing for the engine to find an edge in. NFL and
      # college football run Sep-Jan, NBA and NHL Oct-Jun, so together these
      # cover the calendar with no dead months.
      #
      # Quota: roughly (sports x 24h x 60 / POLL_INTERVAL_MIN) odds requests
      # per day, plus scores and props. At 5 sports and a 30-minute interval
      # that is ~240/day before props. Check this against your plan before
      # adding more; "all" ingests every supported sport and will burn a small
      # plan quickly.
      - key: ACTIVE_SPORTS
        value: americanfootball_nfl,americanfootball_ncaaf,basketball_nba,icehockey_nhl,baseball_mlb
      - key: POLL_INTERVAL_MIN
        value: "30"
      - key: SETTLE_INTERVAL_MIN
        value: "60"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: THE_ODDS_API_KEY
        sync: false
